syntax = "proto3";

package taskmanager.tasks.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/tasker-planner/contracts/gen/go/tasks/v1;tasksv1";

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (Task);
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty);
  rpc RunDailyReport(RunDailyReportRequest) returns (RunDailyReportResponse);
}

message Task {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  bool done = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp completed_at = 7;
}

message CreateTaskRequest {
  string user_id = 1;
  string title = 2;
  string description = 3;
}

enum DoneFilter {
  DONE_FILTER_UNSPECIFIED = 0;
  DONE_FILTER_PENDING = 1;
  DONE_FILTER_DONE = 2;
}

message ListTasksRequest {
  string user_id = 1;
  DoneFilter done_filter = 2;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message UpdateTaskRequest {
  string user_id = 1;
  string task_id = 2;
  Task task = 3;
  google.protobuf.FieldMask update_mask = 4;
}

message DeleteTaskRequest {
  string user_id = 1;
  string task_id = 2;
}

message RunDailyReportRequest {
  string date = 1;
}

message RunDailyReportResponse {
  int32 users_notified = 1;
}
